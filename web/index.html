<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitti AI</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- DOMPurify to sanitize markdown output -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
<body>
    <div id="app">
        <header id="header">
            <div class="logo">Chitti</div>
            <div class="header-controls">
                <div class="status-indicator" id="connection-status">Disconnected</div>
            </div>
        </header>

        <main id="chat-container">
            <div id="messages">
                <!-- Messages will be appended here -->
            </div>
        </main>

        <footer id="input-area">
            <div class="input-controls">
                <button id="toggle-memory" class="control-btn" title="Toggle Memory">🧠 Memory: ON</button>
                <button id="clear-context" class="control-btn" title="Clear Context">🧹 Clear</button>
            </div>
            <div class="input-wrapper">
                <textarea id="prompt-input" placeholder="Message Chitti..." rows="1"></textarea>
                <button id="send-btn" disabled>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
